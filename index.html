<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MKM Website</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Text -->
        <div id="text">Loading...</div>

        <!-- Media -->
        <div id="media"></div>

    </main>

    <script>
        async function loadContent() {
            try {
                // Load content.json
                const response = await fetch("content.json?cache=" + Date.now());

                if (!response.ok) {
                    throw new Error("Could not load content.json");
                }

                const data = await response.json();

                // =========================
                // TEXT
                // =========================

                const textElement = document.getElementById("text");

                textElement.textContent = data.text || "";


                // =========================
                // MEDIA
                // =========================

                const mediaElement = document.getElementById("media");

                // Clear old media
                mediaElement.innerHTML = "";

                if (data.media && data.media.path) {

                    const mediaPath =
                        data.media.path + "?cache=" + Date.now();

                    // IMAGE
                    if (data.media.type === "image") {

                        const img = document.createElement("img");

                        img.src = mediaPath;
                        img.className = "website-media";

                        img.alt = "Uploaded image";

                        mediaElement.appendChild(img);
                    }

                    // VIDEO
                    else if (data.media.type === "video") {

                        const video = document.createElement("video");

                        video.src = mediaPath;
                        video.className = "website-media";

                        video.controls = true;
                        video.preload = "metadata";

                        mediaElement.appendChild(video);
                    }
                }

            } catch (error) {

                console.error(error);

                document.getElementById("text").textContent =
                    "Could not load website content.";
            }
        }

        // Load when page opens
        loadContent();
    </script>

</body>
</html>
