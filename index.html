<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mkm on top lol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <a href="index.html" class="logo">mkm</a>

    <nav>
        <a href="index.html">home</a>
        <a href="index.html?page=symbols">symbols</a>
        <a href="index.html?page=images">images</a>
    </nav>
</header>

<main id="app"></main>

<script>
const symbols = [
    "★",
    "☆",
    "✦",
    "✧",
    "✩",
    "✪",
    "♡",
    "♥",
    "♥︎",
    "ღ",
    "❤",
    "❥",
    "❣",
    "🐾",
    "ฅ",
    "ฅ^•ﻌ•^ฅ",
    "→",
    "←",
    "↑",
    "↓",
    "↗",
    "↘",
    "↙",
    "↖",
    "➜",
    "➤",
    "☻",
    "☺",
    "☼",
    "☾",
    "☽",
    "☁",
    "☄",
    "✦ ✧ ★ ✧ ✦",
    "✩MK:3✩",
    "✩MASON:3✩",
    "made by mkm",
    "^_^",
    "^-^",
    "._.",
    "o_o",
    "O_O",
    ">_<",
    "^.^",
    "x_x"
];

async function getJSON(file) {
    const response = await fetch(file + "?v=" + Date.now());

    if (!response.ok) {
        throw new Error("Could not load " + file);
    }

    return await response.json();
}

function createHome(data) {
    const page = document.createElement("div");
    page.className = "page";

    const title = document.createElement("h1");
    title.textContent = "mkm";

    page.appendChild(title);

    if (data.main_image) {
        const mainImage = document.createElement("img");
        mainImage.src = data.main_image + "?v=" + Date.now();
        mainImage.className = "main-image";
        page.appendChild(mainImage);
    }

    if (data.text) {
        const text = document.createElement("div");
        text.className = "post-text";
        text.textContent = data.text;
        page.appendChild(text);
    }

    if (data.media && data.media.path) {
        const mediaBox = document.createElement("div");
        mediaBox.className = "post-media";

        if (data.media.type === "image") {
            const image = document.createElement("img");
            image.src = data.media.path + "?v=" + Date.now();
            image.className = "website-media";
            mediaBox.appendChild(image);
        }

        if (data.media.type === "video") {
            const video = document.createElement("video");
            video.src = data.media.path + "?v=" + Date.now();
            video.className = "website-media";
            video.controls = true;
            video.preload = "metadata";
            mediaBox.appendChild(video);
        }

        page.appendChild(mediaBox);
    }

    return page;
}

function createSymbols() {
    const page = document.createElement("div");
    page.className = "page";

    const title = document.createElement("h1");
    title.textContent = "symbols";

    page.appendChild(title);

    const box = document.createElement("div");
    box.className = "symbols-box";

    symbols.forEach(symbolText => {
        const item = document.createElement("span");
        item.className = "symbol";
        item.textContent = symbolText;

        item.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(symbolText);

                item.classList.add("copied");

                setTimeout(() => {
                    item.classList.remove("copied");
                }, 400);
            } catch {
                const textarea = document.createElement("textarea");
                textarea.value = symbolText;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand("copy");
                textarea.remove();

                item.classList.add("copied");

                setTimeout(() => {
                    item.classList.remove("copied");
                }, 400);
            }
        });

        box.appendChild(item);
    });

    page.appendChild(box);

    return page;
}

async function createImages() {
    const page = document.createElement("div");
    page.className = "page";

    const title = document.createElement("h1");
    title.textContent = "images";

    page.appendChild(title);

    try {
        const data = await getJSON("image-library.json");

        const grid = document.createElement("div");
        grid.className = "image-grid";

        data.images.forEach(item => {
            const card = document.createElement("div");
            card.className = "image-card";

            const image = document.createElement("img");
            image.src = item.path + "?v=" + Date.now();
            image.loading = "lazy";

            card.appendChild(image);
            grid.appendChild(card);
        });

        page.appendChild(grid);

    } catch {
        const error = document.createElement("div");
        error.className = "library-error";
        error.textContent = "couldn't load images";
        page.appendChild(error);
    }

    return page;
}

async function loadPage() {
    const app = document.getElementById("app");
    app.innerHTML = "";

    const params = new URLSearchParams(window.location.search);
    const page = params.get("page");

    if (page === "symbols") {
        app.appendChild(createSymbols());
        return;
    }

    if (page === "images") {
        app.appendChild(await createImages());
        return;
    }

    try {
        const data = await getJSON("content.json");
        app.appendChild(createHome(data));
    } catch {
        const error = document.createElement("div");
        error.className = "page";
        error.textContent = "couldn't load content";
        app.appendChild(error);
    }
}

loadPage();
</script>

</body>
</html>
